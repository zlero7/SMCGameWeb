workflows:
  ios-workflow:
    name: iOS - 세명컴고 게임과 포털 (무서명)
    max_build_duration: 60

    environment:
      vars:
        VITE_API_BASE_URL: http://10.26.138.120:4000/api
      xcode: latest
      cocoapods: default
      node: v20

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: npm 의존성 설치
        script: |
          cd frontend
          npm install

      - name: 웹 앱 빌드 (모바일용)
        script: |
          cd frontend
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env.mobile
          npm run build:mobile

      - name: CocoaPods 설치
        script: |
          cd frontend/ios/App
          pod install

      - name: iOS 무서명 IPA 빌드
        script: |
          xcodebuild \
            -workspace frontend/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath frontend/ios/App/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          # .app → IPA 패키징
          mkdir -p frontend/ios/App/build/ipa/Payload
          cp -r "$(find frontend/ios/App/build -name '*.app' | head -1)" \
            frontend/ios/App/build/ipa/Payload/
          cd frontend/ios/App/build/ipa
          zip -r SMCGameWeb.ipa Payload/

    artifacts:
      - frontend/ios/App/build/ipa/SMCGameWeb.ipa
      - /tmp/xcodebuild_logs/*.log
